set -g default-terminal "xterm-ghostty"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

# For claude shift+enter
set -g xterm-keys on

# Remove SSH_AUTH_SOCK to disable tmux automatically resetting the variable
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID \
                             SSH_CONNECTION WINDOWID XAUTHORITY"

# Use a symlink to look up SSH authentication
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

bind r source-file ~/.tmux.conf \; display "Reloaded tmux config"

set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g mode-keys vi
set -g status-keys emacs
setw -g aggressive-resize on
set -g mouse on
set -as terminal-features ",*:hyperlinks"

# Update Ghostty tab title with tmux session name
set -g set-titles on
set -g set-titles-string "#S:#W"

# Name new sessions after the working directory
set-hook -g session-created "run-shell 'tmux rename-session \"#{b:pane_current_path}\"'"

# don't rename windows automatically
set-option -g allow-rename off

# New panes inherit current pane's working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Window switching
bind C-p previous-window
bind C-n next-window

# Clear pane scrollback
bind C-k send-keys -R \; clear-history \; send-keys Enter

# Resize panes with prefix + hjkl (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Window indexing (recommended for tmux-dotbar)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Dotbar colorscheme (uses terminal colors to match light/dark themes)
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "colour8"
set -g @tmux-dotbar-fg-current "colour4"
set -g @tmux-dotbar-fg-session "colour8"
set -g @tmux-dotbar-fg-prefix "colour2"

# Reset styles that tmux 3.5+ defaults to visible values (breaks dotbar's
# inline style directives which rely on "default" meaning terminal background)
set -g window-status-current-style "default"
set -g status-right-style "default"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
